repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^examples/.*/(old|new)\.
      - id: trailing-whitespace
        exclude: ^examples/.*/(old|new)\.
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: web-lint
        name: eslint + prettier (apps/web)
        entry: bash -c 'cd apps/web && npx eslint . && npx prettier --check .'
        language: system
        pass_filenames: false
        files: ^apps/web/
