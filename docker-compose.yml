# Local deployment: `docker compose up --build`, then open http://localhost:8000
# The port is bound to 127.0.0.1 only. Set ARTIFACTDIFF_API_TOKEN before exposing it further.
services:
  artifactdiff:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: artifactdiff:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ARTIFACTDIFF_INPUT_RETENTION_HOURS: "24"
      ARTIFACTDIFF_MAX_UPLOAD_MB: "512"
      # ARTIFACTDIFF_API_TOKEN: change-me
      # Use PostgreSQL instead of SQLite (start with `docker compose --profile postgres up`):
      # ARTIFACTDIFF_DATABASE_URL: postgresql+psycopg://artifactdiff:artifactdiff@postgres:5432/artifactdiff
    volumes:
      - artifactdiff-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artifactdiff
      POSTGRES_PASSWORD: artifactdiff
      POSTGRES_DB: artifactdiff
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  artifactdiff-data:
  postgres-data:
