name: ArtifactDiff
description: Meaningful diffs for datasets, models, databases, images, audio, PDFs and 3D assets in pull requests.
author: ArtifactDiff contributors
branding:
  icon: git-pull-request
  color: blue

# Security model (see docs/github-action.md):
# * Use with `on: pull_request` (NOT pull_request_target). The action reads changed files from git
#   objects as data; it never runs code, build scripts or plugins from the pull request.
# * ArtifactDiff itself is installed from this action's own checkout, not from the PR.
# * Required permissions: contents: read (always), pull-requests: write (only for comment-on-pr).

inputs:
  base:
    description: "Base commit (default: the pull request base SHA)."
    required: false
    default: ''
  head:
    description: "Head commit (default: the pull request head SHA)."
    required: false
    default: ''
  paths:
    description: "Only compare files matching these globs (newline- or comma-separated). Default: all."
    required: false
    default: ''
  exclude:
    description: "Globs to skip (added to `exclude` from artifactdiff.toml)."
    required: false
    default: ''
  report-format:
    description: "Format shown in logs; JSON, Markdown and HTML reports are always written to the artifact."
    required: false
    default: markdown
  comment-on-pr:
    description: "Create or update a single pull-request comment with the Markdown report."
    required: false
    default: 'true'
  fail-on:
    description: "Fail the job when a change at or above this severity is found (info, low, medium, high)."
    required: false
    default: ''
  fail-on-error:
    description: "Fail the job when a comparison errors (corrupt or unreadable artifact)."
    required: false
    default: 'false'
  max-files:
    description: "Maximum number of artifacts to compare."
    required: false
    default: '50'
  max-file-size-mb:
    description: "Skip artifacts larger than this."
    required: false
    default: '200'
  include-text:
    description: "Also report plain text/unknown files (normally left to the regular GitHub diff)."
    required: false
    default: 'false'
  upload-artifact:
    description: "Upload the HTML/JSON/Markdown reports as a workflow artifact."
    required: false
    default: 'true'
  artifact-name:
    description: "Name of the uploaded workflow artifact."
    required: false
    default: artifactdiff-report
  extras:
    description: "ArtifactDiff extras to install (comma-separated, e.g. \"tabular,image\"). Default installs all formats."
    required: false
    default: tabular,image,audio,pdf,gltf,safetensors
  python-version:
    description: "Python version used to run ArtifactDiff."
    required: false
    default: '3.12'
  github-token:
    description: "Token used to post the comment."
    required: false
    default: ${{ github.token }}

outputs:
  total-changes:
    description: "Total number of changes across all artifacts."
    value: ${{ steps.run.outputs.total-changes }}
  max-severity:
    description: "Highest change severity (empty if none)."
    value: ${{ steps.run.outputs.max-severity }}
  changed-artifacts:
    description: "Number of artifacts in the report."
    value: ${{ steps.run.outputs.changed-artifacts }}
  report-dir:
    description: "Directory containing report.md, report.html and report.json."
    value: ${{ steps.run.outputs.report-dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ArtifactDiff (from this action, never from the pull request)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXTRAS: ${{ inputs.extras }}
      run: |
        if [[ ! "$EXTRAS" =~ ^[a-z,]*$ ]]; then echo "::error::invalid extras input"; exit 2; fi
        python -m pip install --disable-pip-version-check --quiet "${ACTION_PATH}[${EXTRAS}]"

    - name: Compare changed artifacts
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_MAX_FILE_SIZE_MB: ${{ inputs.max-file-size-mb }}
        INPUT_INCLUDE_TEXT: ${{ inputs.include-text }}
        INPUT_OUTPUT_DIR: ${{ runner.temp }}/artifactdiff-report
      run: python "${ACTION_PATH}/integrations/github-action/run.py"

    - name: Upload reports
      if: always() && inputs.upload-artifact == 'true' && steps.run.outputs.report-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.report-dir }}
        if-no-files-found: ignore
        retention-days: 14
